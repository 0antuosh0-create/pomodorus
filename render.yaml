services:
  - type: web
    name: pomodorus
    runtime: node
    plan: free
    autoDeploy: true
    # tsc has 34 pre-existing strict errors; ship the Vite bundle directly.
    buildCommand: npm install --include=dev && cd client && npm ci --include=dev && npx vite build && cd ..
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: UPSTREAM_HANDLE
        value: anoush
      # UPSTREAM_SESSION_COOKIE is secret: set it in the Render dashboard,
      # never bake it into this file.
      - key: UPSTREAM_ADMIN_TOKEN
        sync: false # Render prompts for the value; strangers never see it.
